<script>
(function(window,document){"use strict";const TOKEN_KEY="librarySurveyAccessToken";const el=id=>document.getElementById(id);const token=()=>sessionStorage.getItem(TOKEN_KEY)||"";
function escapeHtml(value){const node=document.createElement("span");node.textContent=String(value||"");return node.innerHTML;}
function invoke(register){return new Promise(function(resolve,reject){const runner=google.script.run.withSuccessHandler(function(result){if(result&&result.success===false){reject(new Error(result.error||"요청을 처리하지 못했습니다."));return;}resolve(result);}).withFailureHandler(function(){reject(new Error("서버에 연결할 수 없습니다."));});register(runner);});}
const api={login:passcode=>invoke(r=>r.verifyWebAppPasscodeFromWeb(passcode)),validate:()=>invoke(r=>r.validateWebAppTokenFromWeb(token())),logout:()=>invoke(r=>r.logoutWebAppFromWeb(token())),list:includeArchived=>invoke(r=>r.secureListManagedSurveysFromWeb({includeArchived:includeArchived,limit:20},token())),archive:surveyId=>invoke(r=>r.secureArchiveManagedSurveyFromWeb(surveyId,token()))};
function managedSurveyAnalysisUrl_(surveyId){const url=new URL(window.location.href);url.search="";url.hash="";url.searchParams.set("page","survey");url.searchParams.set("ui","v2");url.searchParams.set("surveyId",surveyId);return url.toString();}
function formatDate(value){const date=new Date(value);return Number.isNaN(date.getTime())?"-":date.toLocaleDateString("ko-KR");}
function renderList(surveys){const list=el("surveyManageList");if(!surveys.length){list.innerHTML='<article class="v2-card survey-manage-empty">표시할 설문이 없습니다.</article>';return;}list.innerHTML=surveys.map(function(s){const count=s.responseCountAvailable?Number(s.responseCount||0).toLocaleString("ko-KR")+"건":"확인 불가";return '<article class="v2-card survey-manage-card" data-survey-id="'+escapeHtml(s.surveyId)+'"><div><h3>'+escapeHtml(s.title||"제목 없는 설문")+'</h3><p>'+escapeHtml(s.targetAudience||"")+'</p></div><dl><dt>상태</dt><dd>'+(s.status==="ARCHIVED"?"보관됨":"응답 수집 중")+'</dd></dl><dl><dt>응답</dt><dd>'+count+'</dd></dl><dl><dt>생성일</dt><dd>'+formatDate(s.createdAt)+'</dd></dl><div class="survey-manage-actions"><a class="v2-button v2-button--quiet" href="'+escapeHtml(s.publishedUrl)+'" target="_blank" rel="noopener noreferrer">응답하기</a><a class="v2-button v2-button--quiet" href="'+escapeHtml(s.editUrl)+'" target="_blank" rel="noopener noreferrer">Form 편집</a><a class="v2-button v2-button--quiet" href="'+escapeHtml(s.responseSpreadsheetUrl)+'" target="_blank" rel="noopener noreferrer">응답 시트</a><a class="v2-button v2-button--primary" href="'+escapeHtml(managedSurveyAnalysisUrl_(s.surveyId))+'" target="_top">AI 분석</a>'+(s.status==="COLLECTING"?'<button class="v2-button v2-button--quiet" data-action="archive">보관</button>':'')+'</div></article>';}).join("");}
function load(){el("surveyManageStatus").textContent="설문 목록을 불러오고 있습니다.";api.list(el("surveyManageArchivedFilter").checked).then(function(result){renderList(result.surveys||[]);el("surveyManageStatus").textContent="최대 20개의 설문을 표시합니다. 응답 수는 실제 응답 시트에서 확인했습니다.";}).catch(function(error){el("surveyManageStatus").className="v2-upload-status v2-upload-status--error";el("surveyManageStatus").textContent=error.message;});}
function open(){el("surveyManageAccessGate").hidden=true;el("surveyManageApplication").hidden=false;load();}
el("surveyManageAccessForm").addEventListener("submit",function(event){event.preventDefault();api.login(el("surveyManagePasscode").value.trim()).then(function(result){sessionStorage.setItem(TOKEN_KEY,result.token);open();}).catch(error=>el("surveyManageAccessError").textContent=error.message);});el("surveyManageArchivedFilter").addEventListener("change",load);el("surveyManageList").addEventListener("click",function(event){const button=event.target.closest('[data-action="archive"]');if(!button)return;const surveyId=button.closest("[data-survey-id]").dataset.surveyId;if(!window.confirm("이 설문을 보관하시겠습니까? Google Form과 응답 시트는 삭제되지 않습니다."))return;api.archive(surveyId).then(load).catch(error=>window.alert(error.message));});el("surveyManageLogoutButton").addEventListener("click",function(){api.logout().catch(()=>null).then(function(){sessionStorage.removeItem(TOKEN_KEY);window.location.reload();});});if(token())api.validate().then(result=>result.authenticated?open():sessionStorage.removeItem(TOKEN_KEY)).catch(()=>sessionStorage.removeItem(TOKEN_KEY));
})(window,document);
</script>
