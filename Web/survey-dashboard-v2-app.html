function friendlyError(error) {
  const raw = String(
    error && error.message
      ? error.message
      : error || ""
  );

  const safe = raw
    .replace(/^Exception:\s*/i, "")
    .split(/\n\s*at\s+/)[0]
    .slice(0, 1500);

  const lower = raw.toLowerCase();

  // ------------------------------------------------------------------
  // 1. Gemini API 사용량·요청 제한
  // ------------------------------------------------------------------

  if (
    /429/.test(raw)
    || /quota exceeded/i.test(raw)
    || /rate limit/i.test(raw)
    || /resource_exhausted/i.test(raw)
    || /too many requests/i.test(raw)
  ) {
    const retrySeconds = extractRetryAfterSeconds(raw);

    return retrySeconds
      ? "현재 AI 서비스 사용량이 많습니다. "
        + retrySeconds
        + "초 후 다시 시도해 주세요."
      : "현재 AI 서비스 사용량이 많습니다. 잠시 후 다시 시도해 주세요.";
  }

  // ------------------------------------------------------------------
  // 2. 인증·API 키 오류
  // ------------------------------------------------------------------

  if (
    /401/.test(raw)
    || /unauthorized/i.test(raw)

    || /api key.*invalid/i.test(raw)

  // ------------------------------------------------------------------

    /403/.test(raw)

    || /forbidden/i.test(raw)
    || /billing/i.test(raw)
    || /access denied/i.test(raw)

    return "AI 서비스 사용 권한을 확인할 수 없습니다. 관리자에게 권한 또는 결제 설정 확인을 요청해 주세요.";
  }

  // ------------------------------------------------------------------
  // 4. 모델 또는 API 주소 오류

    /404/.test(raw)

    || /model.*not.*found/i.test(raw)
    || /models\/.*not found/i.test(raw)

  // 5. 잘못된 요청

    /400/.test(raw)
    || /bad request/i.test(raw)
    || /invalid argument/i.test(raw)
    || /request payload/i.test(raw)
  ) {
    return "AI에 전달된 요청 내용을 처리하지 못했습니다. 입력 데이터와 AI 설정을 확인한 뒤 다시 시도해 주세요.";
  }

  // 6. 서버 내부 오류
  // ------------------------------------------------------------------

    /500/.test(raw)

    || /internal_error/i.test(raw)

  }

  if (

  ) {

  }

  if (
    /매핑|문항|columnnumber|척도|scoremap|json/i.test(lower)
  ) {
    return "문항 매핑을 처리하지 못했습니다. 문항 유형과 척도·점수 매핑 값을 확인해 주세요.";
  }

  // ------------------------------------------------------------------
  // 13. 통계 및 AI 보고서 오류
  // ------------------------------------------------------------------

  if (
    /^통계 분석 실패 \(/.test(safe)
  ) {
    return "통계 분석을 완료하지 못했습니다. 원자료와 문항 설정을 확인한 뒤 다시 실행해 주세요.";

return "문제: 요청을 완료하지 못했습니다. 영향: 현재 작업이 저장되지 않았습니다. 해결: 입력 상태를 확인한 뒤 다시 시도하고, 계속되면 관리자에게 문의해 주세요.";

/**
 * Gemini 오류 메시지에서 재시도 대기 시간을 찾습니다.
 *
 * 예:
 * - Please retry in 37.8s
 * - retryDelay: 38s
 * - retry after 60 seconds
 *
 * @param {string} rawMessage
 * @return {number|null}
 */
function extractRetryAfterSeconds(rawMessage) {
  const text = String(rawMessage || "");

  const patterns = [
    /retry\s+in\s+([\d.]+)\s*s/i,
    /retry\s+after\s+([\d.]+)\s*(?:s|sec|seconds?)/i,
    /retrydelay["']?\s*[:=]\s*["']?([\d.]+)\s*s/i,
    /([\d.]+)\s*초\s*후/i
  ];

  for (
    let index = 0;
    index < patterns.length;
    index += 1
  ) {
    const matched = text.match(patterns[index]);

    if (matched) {
      return Math.max(
        1,
        Math.ceil(
          Number(matched[1])
        )
      );
    }
  }

  return null;
}

  const api = {
    invoke:function(executor,options){
      options=options||{};const useGlobalLoading=options.globalLoading===true;if(useGlobalLoading)setLoading(true,options.loadingText||"요청을 처리하고 있습니다.");
      return new Promise(function(resolve,reject){
        let runner=google.script.run.withSuccessHandler(function(result){if(useGlobalLoading)setLoading(false);if(!result||result.success!==true){console.error("[API_ERROR]",result&&result.error?result.error:result);const message=friendlyError(result&&result.error?result.error:result&&result.message);showStatus(message,"error");reject(new Error(message));return;}resolve(result);}).withFailureHandler(function(error){if(useGlobalLoading)setLoading(false);console.error("[API_FAILURE]",error);const message=friendlyError(error);showStatus(message,"error");reject(new Error(message));});
        executor(runner);
      });
    },
    validateToken:function(){return this.invoke(function(runner){runner.validateWebAppTokenFromWeb(token());},{globalLoading:true,loadingText:"세션을 확인하고 있습니다."});},
    login:function(passcode){return this.invoke(function(runner){runner.verifyWebAppPasscodeFromWeb(passcode);},{globalLoading:true,loadingText:"담당자 인증 중입니다."});},
    settings:function(){return this.invoke(function(runner){runner.secureGetSurveySettingsForWeb(token());},{globalLoading:false});},
    saveSettings:function(payload){return this.invoke(function(runner){runner.secureSaveSurveySettingsFromWeb(payload,token());},{globalLoading:false});},
    systemStatus:function(){return this.invoke(function(runner){runner.secureGetDynamicSurveySystemStatusFromWeb(token());},{globalLoading:false});},
    createRawData:function(filePayload){return this.invoke(function(runner){runner.secureCreateGenericRawSheetFromWeb(filePayload,token());},{globalLoading:false});},
    inspectMapping:function(filePayload){return this.invoke(function(runner){runner.secureInspectSurveyExcelForMappingFromWeb(filePayload,token());},{globalLoading:false});},
    inspectMappingByRule:function(filePayload){return this.invoke(function(runner){runner.secureInspectSurveyExcelByRuleFromWeb(filePayload,token());},{globalLoading:false});},
    savedMappings:function(){return this.invoke(function(runner){runner.secureGetSavedSurveyMappingsFromWeb(token());},{globalLoading:false});},
    saveMappings:function(payload){return this.invoke(function(runner){runner.secureSaveSurveyMappingsFromWeb(payload,token());},{globalLoading:false});},
    generateAnalysis:function(){return this.invoke(function(runner){runner.secureGenerateDynamicStatisticalReportFromWeb(token());},{globalLoading:false});},
    dashboardData:function(){return this.invoke(function(runner){runner.secureGetDynamicSurveyDashboardDataFromWeb(token());},{globalLoading:false});},
    runQuality:function(){return this.invoke(function(runner){runner.secureGetDynamicSurveyQualityFromWeb(token());},{globalLoading:false});},
    generateAiReport:function(){return this.invoke(function(runner){runner.secureGenerateDynamicAIReportFromWeb(token());},{globalLoading:false});},
    exportReport:function(fileName){return this.invoke(function(runner){runner.secureExportDynamicSurveyReportFromWeb(fileName,token(),{});},{globalLoading:false});},
    logout:function(){return this.invoke(function(runner){runner.logoutWebAppFromWeb(token());},{globalLoading:true,loadingText:"로그아웃하고 있습니다."});}
  };

  function setLoading(active,message){state.loading=active;el("v2Loading").hidden=!active;el("v2LoadingText").textContent=message||"처리 중입니다.";}
  function setButtonBusy_(button,busy,busyLabel,idleLabel){if(!button)return;button.disabled=Boolean(busy);button.setAttribute("aria-busy",String(Boolean(busy)));button.textContent=busy?busyLabel:idleLabel;}
  function showStatus(message,type){const box=el("v2GlobalStatus");box.hidden=!message;box.textContent=message||"";box.className="v2-global-status"+(type?" v2-global-status--"+type:"");if(message)showToast(message);}

  function stepStatus(step){if(step.id===state.currentPage)return "current";if(state.completedSteps.indexOf(step.id)>=0)return "complete";if(step.id==="quality"&&state.qualityStatus==="WARNING")return "warning";return state.accessibleSteps.indexOf(step.id)>=0?"available":"locked";}

  function normalizedProcessingState_(status){
    const value=String(status||"idle").toLowerCase();
    if(value==="running"||value==="saving"||value==="creating"||value==="loading")return "running";
    if(value==="success"||value==="saved"||value==="existing")return "success";
    if(value==="error"||value==="failed")return "error";
    return "idle";
  }
  function applyProcessingState_(prefix,status,copy){
    const normalized=normalizedProcessingState_(status),card=el("v2"+prefix+"Processing"),details=el("v2"+prefix+"LogDetails");
    if(card){card.dataset.processingState=normalized;card.setAttribute("aria-busy",String(normalized==="running"));}

    const progress=el("v2"+prefix+"Progress");if(progress){progress.hidden=normalized!=="running";progress.removeAttribute("aria-valuenow");}
    const stage=el("v2"+prefix+"Stage");if(stage&&copy&&copy[normalized])stage.textContent=copy[normalized];
    return normalized;
  }
  function workflowStepRunning_(id){return id==="analysis"&&state.analysisStatus==="running"||id==="quality"&&state.qualityRunStatus==="running"||id==="ai"&&state.aiRunStatus==="running"||id==="download"&&state.downloadStatus==="running";}
  function deriveWorkflow(){
    const status=state.serverStatus||{};const complete=[];const accessible=["dashboard","settings"];

  }

    const badge=el("v2HeaderQuality");badge.textContent=qualityLabel(state.qualityStatus);badge.className="v2-badge "+(state.qualityStatus==="PASS"?"v2-badge--success":state.qualityStatus==="WARNING"||state.qualityStatus==="STALE"?"v2-badge--warning":state.qualityStatus==="FAIL"||state.qualityStatus==="ERROR"?"v2-badge--error":"v2-badge--neutral");
    renderSteps();renderPage();renderDashboard();renderBottomNav();renderSettings();renderUpload();renderMapping();renderAnalysis();renderQuality();renderAiReport();renderDownload();
  }
function getQualityUserMessage_(item) {

  }

  switch (item.code) {
case "SCALE_UNMAPPED_VALUE":

    );

    case "SCALE_OUT_OF_RANGE":

;if(hasFile){el("v2DownloadFileName").textContent=state.downloadResult.fileName||"만족도조사_결과보고서.xlsx";el("v2DownloadFileMeta").textContent=(stale?"업데이트 필요 · ":"")+"생성 시각: "+(state.downloadGeneratedAt||"확인 필요");el("v2DownloadIncludedSheets").textContent=state.downloadResult.includedSheets&&state.downloadResult.includedSheets.length?"포함 시트: "+state.downloadResult.includedSheets.join(", "):"포함 시트: 01_조사개요 ~ 09_원자료";}el("v2DownloadFileButton").disabled=!hasFile;}
  function downloadExportResult(result){if(!result||!result.base64Data)throw new Error("다운로드할 Excel 데이터가 없습니다.");const binary=window.atob(result.base64Data);const bytes=new Uint8Array(binary.length);for(let index=0;index<binary.length;index+=1)bytes[index]=binary.charCodeAt(index);const blob=new Blob([bytes],{type:result.mimeType||"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});const url=URL.createObjectURL(blob);const link=document.createElement("a");link.href=url;link.download=result.fileName||"만족도조사_결과보고서.xlsx";document.body.appendChild(link);link.click();link.remove();window.setTimeout(function(){URL.revokeObjectURL(url);},1000);}

  function loadContext(){Promise.all([api.settings(),api.systemStatus()]).then(function(results){const settingsResult=results[0]||{};const settings=settingsResult.settings||{};const status=results[1];state.settingsExists=Boolean(settingsResult.exists);state.settingsStatus=state.settingsExists?"loaded":"idle";state.settingsData=settings;fillSettingsForm(settings);state.projectName=settings.surveyName||"프로젝트 미선택";state.respondentCount=Number(status.respondentCount||0);state.serverStatus=status;state.qualityStatus=status.qualityStatus||"NOT_RUN";state.rawDataStatus=status.rawSheetExists?"success":"idle";if(status.statisticsComplete&&state.analysisStatus==="idle"){state.analysisStatus="existing";state.analysisProgress=100;state.analysisStage="기존에 생성된 통계 보고서가 있습니다.";state.analysisLogs=[{time:"",message:"기존 통계 보고서 상태를 서버에서 확인했습니다."}];state.analysisSummary={respondentCount:Number(status.respondentCount||0),analyzedQuestionCount:null,generatedSheetCount:Number(status.statisticalSheetCount||0),generatedAt:"기존 생성 결과"};}if(status.aiComplete&&state.aiRunStatus==="idle"){state.aiRunStatus="existing";state.aiProgress=100;state.aiStage="기존에 생성된 AI 보고서가 있습니다.";state.aiLogs=[{time:"",message:"기존 AI 보고서 상태를 서버에서 확인했습니다."}];state.aiResult={generatedSheets:[],validOpinionCount:null,categoryCount:null};state.aiGeneratedAt="기존 생성 결과";}if(!el("v2ExportFileName").value)el("v2ExportFileName").value=(settings.surveyName?settings.surveyName+"_결과보고서":"만족도조사_결과보고서")+".xlsx";deriveWorkflow();if(status.statisticsComplete)loadDashboardData_();if(state.accessibleSteps.indexOf(state.currentPage)<0)state.currentPage="settings";render();}).catch(function(error){setState({settingsStatus:"error",settingsError:friendlyError(error)},false);render();});}
