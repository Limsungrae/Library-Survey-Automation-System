function friendlyError(error) {
  const raw = String(
    error && error.message
      ? error.message
      : error || ""
  );

  const safe = raw
    .replace(/^Exception:\s*/i, "")
    .split(/\n\s*at\s+/)[0]
    .slice(0, 1500);

  const lower = raw.toLowerCase();

  // ------------------------------------------------------------------
  // 1. Gemini API 사용량·요청 제한
  // ------------------------------------------------------------------

  if (
    /429/.test(raw)
    || /quota exceeded/i.test(raw)
    || /rate limit/i.test(raw)
    || /resource_exhausted/i.test(raw)
    || /too many requests/i.test(raw)
  ) {
    const retrySeconds = extractRetryAfterSeconds(raw);

    return retrySeconds
      ? "현재 AI 서비스 사용량이 많습니다. "
        + retrySeconds
        + "초 후 다시 시도해 주세요."
      : "현재 AI 서비스 사용량이 많습니다. 잠시 후 다시 시도해 주세요.";
  }

  // ------------------------------------------------------------------
  // 2. 인증·API 키 오류
  // ------------------------------------------------------------------

  if (
    /401/.test(raw)
    || /unauthorized/i.test(raw)
    || /invalid api key/i.test(raw)
    || /api key.*invalid/i.test(raw)
    || /authentication/i.test(raw)
  ) {
    return "AI 서비스 인증에 실패했습니다. 관리자에게 API 설정 확인을 요청해 주세요.";
  }

  // ------------------------------------------------------------------
  // 3. 권한·결제·사용 제한
  // ------------------------------------------------------------------

  if (
    /403/.test(raw)
    || /permission denied/i.test(raw)
    || /forbidden/i.test(raw)
    || /billing/i.test(raw)
    || /access denied/i.test(raw)
  ) {
    return "AI 서비스 사용 권한을 확인할 수 없습니다. 관리자에게 권한 또는 결제 설정 확인을 요청해 주세요.";
  }

  // ------------------------------------------------------------------
  // 4. 모델 또는 API 주소 오류
  // ------------------------------------------------------------------

  if (
    /404/.test(raw)
    || /not found/i.test(raw)
    || /model.*not.*found/i.test(raw)
    || /models\/.*not found/i.test(raw)
  ) {
    return "설정된 AI 모델을 찾을 수 없습니다. 관리자에게 AI 모델 설정 확인을 요청해 주세요.";
  }

  // ------------------------------------------------------------------
  // 5. 잘못된 요청
  // ------------------------------------------------------------------

  if (
    /400/.test(raw)
    || /bad request/i.test(raw)
    || /invalid argument/i.test(raw)
    || /request payload/i.test(raw)
  ) {
    return "AI에 전달된 요청 내용을 처리하지 못했습니다. 입력 데이터와 AI 설정을 확인한 뒤 다시 시도해 주세요.";
  }

  // ------------------------------------------------------------------
  // 6. 서버 내부 오류
  // ------------------------------------------------------------------

  if (
    /500/.test(raw)
    || /internal server error/i.test(raw)
    || /internal_error/i.test(raw)
  ) {
    return "AI 서버에서 일시적인 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.";
  }

  // ------------------------------------------------------------------
  // 7. 서비스 일시 중단
  // ------------------------------------------------------------------

  if (
    /502/.test(raw)
    || /503/.test(raw)
    || /service unavailable/i.test(raw)
    || /unavailable/i.test(raw)
    || /bad gateway/i.test(raw)
    || /overloaded/i.test(raw)
  ) {
    return "현재 AI 서비스가 일시적으로 응답하지 않습니다. 잠시 후 다시 시도해 주세요.";
  }

  // ------------------------------------------------------------------
  // 8. 응답 시간 초과
  // ------------------------------------------------------------------

  if (
    /504/.test(raw)
    || /timeout/i.test(raw)
    || /timed out/i.test(raw)
    || /deadline exceeded/i.test(raw)
    || /execution time/i.test(raw)
  ) {
    return "AI 응답 시간이 초과되었습니다. 잠시 후 다시 시도해 주세요.";
  }

  // ------------------------------------------------------------------
  // 9. 인터넷·네트워크 오류
  // ------------------------------------------------------------------

  if (
    /network/i.test(raw)
    || /failed to fetch/i.test(raw)
    || /connection/i.test(raw)
    || /socket/i.test(raw)
    || /dns/i.test(raw)
  ) {
    return "네트워크 연결이 불안정합니다. 인터넷 연결을 확인한 뒤 다시 시도해 주세요.";
  }

  // ------------------------------------------------------------------
  // 10. 기존 시스템 인증 오류
  // ------------------------------------------------------------------

  if (
    /인증|token|토큰|만료/i.test(raw)
  ) {

  }

  // ------------------------------------------------------------------
  // 11. 파일 처리 오류
  // ------------------------------------------------------------------

  if (
    /size|크기|12\s*mb/i.test(raw)
  ) {
    return "파일이 최대 허용 용량 12MB를 초과했습니다. 불필요한 시트를 제거하거나 파일을 나누어 주세요.";
  }

  if (
    /drive|드라이브|permission|access denied/i.test(raw)
  ) {
    return "파일 저장 공간에 접근할 수 없습니다. 관리자에게 Drive 권한 확인을 요청해 주세요.";
  }

  if (
    /변환.*실패|변환할 수|conversion/i.test(raw)
  ) {
    return "Excel 파일 변환에 실패했습니다. 파일을 다시 저장한 뒤 시도해 주세요.";
  }

  if (
    /xlsx|xls|excel|signature|서명/i.test(raw)
  ) {
    return "지원되는 Excel 파일로 확인되지 않았습니다. .xlsx 또는 .xls 형식으로 다시 저장해 주세요.";
  }

  // ------------------------------------------------------------------
  // 12. 문항 매핑 오류
  // ------------------------------------------------------------------

  if (
    /원자료.*컬럼|필수.*컬럼|컬럼.*누락|중복.*(문항|헤더)|빈.*(문항|헤더)|문항.*헤더.*비어/i.test(raw)
  ) {
    return safe;
  }

  if (
    /문항 매핑.*(미저장|저장되지|먼저)|매핑.*저장.*필요|먼저.*문항.*(구조|유형).*저장/i.test(raw)
  ) {
    return safe;
  }

  if (
    /매핑|문항|columnnumber|척도|scoremap|json/i.test(lower)
  ) {
    return "문항 매핑을 처리하지 못했습니다. 문항 유형과 척도·점수 매핑 값을 확인해 주세요.";
  }

  // ------------------------------------------------------------------
  // 13. 통계 및 AI 보고서 오류
  // ------------------------------------------------------------------

  if (
    /^통계 분석 실패 \(/.test(safe)
  ) {
    return safe;
  }

  if (
    /통계|분석 결과|보고서/i.test(raw)
  ) {
    return "통계 분석을 완료하지 못했습니다. 원자료와 문항 매핑 상태를 확인한 뒤 다시 시도해 주세요.";
  }

  if (
    /gemini|ai|총평|향후계획/i.test(raw)
  ) {
    return "AI 보고서를 생성하지 못했습니다. 잠시 후 다시 시도하거나 관리자에게 AI 설정 확인을 요청해 주세요.";
  }

  // ------------------------------------------------------------------
  // 14. 알 수 없는 오류
  // ------------------------------------------------------------------

return safe ||
"요청을 완료하지 못했습니다. 잠시 후 다시 시도해 주세요.";
}


/**
 * Gemini 오류 메시지에서 재시도 대기 시간을 찾습니다.
 *
 * 예:
 * - Please retry in 37.8s
 * - retryDelay: 38s
 * - retry after 60 seconds
 *
 * @param {string} rawMessage
 * @return {number|null}
 */
function extractRetryAfterSeconds(rawMessage) {
  const text = String(rawMessage || "");

  const patterns = [
    /retry\s+in\s+([\d.]+)\s*s/i,
    /retry\s+after\s+([\d.]+)\s*(?:s|sec|seconds?)/i,
    /retrydelay["']?\s*[:=]\s*["']?([\d.]+)\s*s/i,
    /([\d.]+)\s*초\s*후/i
  ];

  for (
    let index = 0;
    index < patterns.length;
    index += 1
  ) {
    const matched = text.match(patterns[index]);

    if (matched) {
      return Math.max(
        1,
        Math.ceil(
          Number(matched[1])
        )
      );
    }
  }

  return null;
}

  const api = {
    invoke:function(executor,options){
      options=options||{};const useGlobalLoading=options.globalLoading!==false;if(useGlobalLoading)setLoading(true,options.loadingText||"요청을 처리하고 있습니다.");

        executor(runner);
      });
    },

    inspectMappingByRule:function(filePayload){return this.invoke(function(runner){runner.secureInspectSurveyExcelByRuleFromWeb(filePayload,token());},{loadingText:"규칙 기반 문항 매핑을 분석하고 있습니다."});},
    savedMappings:function(){return this.invoke(function(runner){runner.secureGetSavedSurveyMappingsFromWeb(token());},{loadingText:"저장된 문항 매핑을 확인하고 있습니다."});},
    saveMappings:function(payload){return this.invoke(function(runner){runner.secureSaveSurveyMappingsFromWeb(payload,token());},{loadingText:"검토한 문항 매핑을 저장하고 있습니다."});},
    generateAnalysis:function(){return this.invoke(function(runner){runner.secureGenerateDynamicStatisticalReportFromWeb(token());},{globalLoading:false});},
    runQuality:function(){return this.invoke(function(runner){runner.secureGetDynamicSurveyQualityFromWeb(token());},{globalLoading:false});},
    generateAiReport:function(){return this.invoke(function(runner){runner.secureGenerateDynamicAIReportFromWeb(token());},{globalLoading:false});},
    exportReport:function(fileName){return this.invoke(function(runner){runner.secureExportDynamicSurveyReportFromWeb(fileName,token(),{});},{globalLoading:false});},
    logout:function(){return this.invoke(function(runner){runner.logoutWebAppFromWeb(token());},{loadingText:"로그아웃하고 있습니다."});}
  };

  function setLoading(active,message){state.loading=active;el("v2Loading").hidden=!active;el("v2LoadingText").textContent=message||"처리 중입니다.";}
  function showStatus(message,type){const box=el("v2GlobalStatus");box.hidden=!message;box.textContent=message||"";box.className="v2-global-status"+(type?" v2-global-status--"+type:"");if(message)showToast(message);}

  function deriveWorkflow(){

    renderSteps();renderPage();renderDashboard();renderBottomNav();renderSettings();renderUpload();renderMapping();renderAnalysis();renderQuality();renderAiReport();renderDownload();

function getQualityUserMessage_(item) {
