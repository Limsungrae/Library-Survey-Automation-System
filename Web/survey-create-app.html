<script>
(function(window,document){
  "use strict";
  const TOKEN_KEY="librarySurveyAccessToken";
  const TYPE_OPTIONS=[
    {value:"SINGLE",label:"단일선택"},{value:"MULTIPLE",label:"복수선택"},
    {value:"SCALE",label:"5점 만족도"},{value:"TEXT",label:"주관식"},
    {value:"RESPONDENT",label:"응답자 정보"}
  ];
  const SCALE_OPTIONS=["매우 만족","만족","보통","불만족","매우 불만족"];
  const state={view:"INPUT",authenticated:false,questions:[],draftSurvey:null,editingId:"",editDraft:null,adding:false,formData:{title:"",targetAudience:"",department:"",contact:"",requestContent:"",referenceInfo:""}};
  function el(id){return document.getElementById(id);}
  function token(){return sessionStorage.getItem(TOKEN_KEY)||"";}
  function escapeHtml(value){return String(value===null||value===undefined?"":value).replace(/[&<>"']/g,function(character){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[character];});}
  function typeLabel(type){const option=TYPE_OPTIONS.find(function(item){return item.value===type;});return option?option.label:"단일선택";}
  function hasEditableOptions(type){return ["SINGLE","MULTIPLE","RESPONDENT"].indexOf(type)>=0;}
  function setLoading(active,message){el("surveyCreateLoading").hidden=!active;el("surveyCreateLoadingText").textContent=message||"처리 중입니다.";}
  function showStatus(message,type){const box=el("surveyCreateGlobalStatus");box.hidden=!message;box.textContent=message||"";box.className="v2-global-status"+(type?" v2-global-status--"+type:"");}
  function setButtonBusy_(button,busy,busyLabel,idleLabel){button.disabled=Boolean(busy);button.setAttribute("aria-busy",String(Boolean(busy)));button.textContent=busy?busyLabel:idleLabel;}
  const api={
    invoke:function(executor,loadingText){if(loadingText)setLoading(true,loadingText);return new Promise(function(resolve,reject){const runner=google.script.run.withSuccessHandler(function(result){if(loadingText)setLoading(false);if(!result||result.success!==true){reject(new Error(result&&result.error||"요청을 완료하지 못했습니다."));return;}resolve(result);}).withFailureHandler(function(error){if(loadingText)setLoading(false);reject(new Error(error&&error.message||String(error)));});executor(runner);});},
    validate:function(){return this.invoke(function(runner){runner.validateWebAppTokenFromWeb(token());},"세션을 확인하고 있습니다.");},
    login:function(passcode){return this.invoke(function(runner){runner.verifyWebAppPasscodeFromWeb(passcode);},"담당자 인증 중입니다.");},
    logout:function(){return this.invoke(function(runner){runner.logoutWebAppFromWeb(token());},"로그아웃하고 있습니다.");},
    generateSurveyDraft:function(payload){return this.invoke(function(runner){runner.secureGenerateSurveyDraftFromWeb(payload,token());});}
  };

  function syncSteps_(){const order={INPUT:0,GENERATING:0,DRAFT_REVIEW:1,FORM_CREATING:2,COMPLETED:2},active=order[state.view]||0;["Input","Review","Form"].forEach(function(name,index){const item=el("surveyCreateStep"+name),status=item.querySelector(".v2-step__status");item.className="v2-step"+(index===active?" v2-step--current":index<active?" v2-step--complete":"");status.textContent=index===active?(state.view==="GENERATING"||state.view==="FORM_CREATING"?"처리 중":"현재"):index<active?"✓ 완료":"대기";});}
  function render(){el("surveyCreateInputView").hidden=state.view!=="INPUT";el("surveyCreateProcessingView").hidden=state.view!=="GENERATING"&&state.view!=="FORM_CREATING";el("surveyCreateReviewView").hidden=state.view!=="DRAFT_REVIEW";el("surveyCreateCompletedView").hidden=state.view!=="COMPLETED";syncSteps_();if(state.view==="DRAFT_REVIEW")renderQuestions_();if(state.view==="GENERATING"){el("surveyCreateProcessingTitle").textContent="설문 문항을 구성하고 있습니다.";el("surveyCreateProcessingDescription").textContent="조사 목적과 대상에 맞는 질문을 준비하고 있습니다.";}if(state.view==="FORM_CREATING"){el("surveyCreateProcessingTitle").textContent="Google Form 생성 준비를 확인하고 있습니다.";el("surveyCreateProcessingDescription").textContent="검토한 문항을 Form으로 전달할 준비를 하고 있습니다.";}}
  function readForm_(){return {title:el("surveyCreateTitleInput").value.trim(),targetAudience:el("surveyCreateAudienceInput").value.trim(),department:el("surveyCreateDepartmentInput").value.trim(),contact:el("surveyCreateContactInput").value.trim(),requestContent:el("surveyCreateRequestInput").value.trim(),referenceInfo:el("surveyCreateReferenceInput").value.trim()};}
  function validateInput_(input){const fields=[{key:"title",id:"surveyCreateTitleError",message:"조사명을 입력해 주세요."},{key:"targetAudience",id:"surveyCreateAudienceError",message:"조사 대상을 입력해 주세요."},{key:"requestContent",id:"surveyCreateRequestError",message:"설문 요청내용을 입력해 주세요."}],missing=[];fields.forEach(function(field){const invalid=!input[field.key];el(field.id).textContent=invalid?field.message:"";if(invalid)missing.push(field);});if(missing.length){showStatus("필수 입력값을 확인해 주세요.","error");el(missing[0].id.replace("Error","Input")).focus();return false;}showStatus("","");return true;}
  function generateDraft_(event){event.preventDefault();const input=readForm_();if(!validateInput_(input))return;state.formData=input;state.view="GENERATING";render();api.generateSurveyDraft(input).then(function(result){state.draftSurvey=result.draft.survey;state.questions=result.draft.questions.map(function(question){return Object.assign({},question,{id:question.questionId});});state.view="DRAFT_REVIEW";showStatus("설문 초안이 생성되었습니다.","success");render();el("surveyCreateMain").focus();}).catch(function(){state.view="INPUT";showStatus("설문 초안을 생성하지 못했습니다. 잠시 후 다시 시도해 주세요.","error");render();el("surveyCreateGenerateButton").focus();});}
  function optionSummary_(question){const options=question.options||[];if(question.type==="SCALE")return "표준 만족도 5점 척도";if(!options.length)return question.type==="TEXT"?"자유롭게 작성하는 문항":"선택지 없음";const visible=options.slice(0,3).join(" · ");return visible+(options.length>3?" 외 "+(options.length-3)+"개":"");}
  function questionHtml_(question,index){const editing=state.editingId===question.id;return '<article class="v2-card survey-create-question'+(editing?' survey-create-question--editing':'')+'" data-question-id="'+escapeHtml(question.id)+'"><div class="survey-create-question__top"><span class="survey-create-question__number">Q'+(index+1)+'</span><div class="survey-create-question__content"><h3>'+escapeHtml(question.title)+'</h3><p class="survey-create-question__summary">'+escapeHtml(optionSummary_(question))+'</p></div><div class="survey-create-question__badges"><span class="v2-badge v2-badge--ai">'+escapeHtml(typeLabel(question.type))+'</span><span class="v2-badge '+(question.required?'v2-badge--success':'v2-badge--neutral')+'">'+(question.required?'필수':'선택')+'</span></div><div class="survey-create-question__actions"><button class="v2-button v2-button--quiet survey-create-icon-action" data-action="up" type="button" aria-label="Q'+(index+1)+' 위로 이동" title="위로 이동" '+(index===0?'disabled':'')+'>↑</button><button class="v2-button v2-button--quiet survey-create-icon-action" data-action="down" type="button" aria-label="Q'+(index+1)+' 아래로 이동" title="아래로 이동" '+(index===state.questions.length-1?'disabled':'')+'>↓</button><button class="v2-button v2-button--quiet" data-action="edit" type="button">수정</button><button class="v2-button v2-button--quiet survey-create-delete" data-action="delete" type="button">삭제</button></div></div>'+(editing?editorHtml_(state.editDraft,false):'')+'</article>';}
  function optionEditorHtml_(draft){if(draft.type==="SCALE")return '<div class="survey-create-scale-preset"><strong>표준 만족도 5점 척도</strong><span>'+SCALE_OPTIONS.map(escapeHtml).join(' · ')+'</span></div>';if(!hasEditableOptions(draft.type))return '';return '<fieldset class="survey-create-option-editor"><legend>선택지</legend><div data-option-list>'+draft.options.map(function(option,index){return '<div class="survey-create-option-row"><input data-option-index="'+index+'" value="'+escapeHtml(option)+'" aria-label="선택지 '+(index+1)+'"><button class="v2-button v2-button--quiet survey-create-delete" data-action="remove-option" data-option-index="'+index+'" type="button">삭제</button></div>';}).join('')+'</div><button class="v2-button v2-button--quiet" data-action="add-option" type="button">+ 선택지 추가</button></fieldset>';}
  function editorHtml_(draft,isNew){return '<div class="survey-create-editor" data-editor-kind="'+(isNew?'new':'existing')+'"><label><span>질문</span><input data-edit="title" value="'+escapeHtml(draft.title)+'" placeholder="질문을 입력해 주세요."></label><div class="survey-create-editor-row"><label><span>문항 유형</span><select data-edit="type">'+TYPE_OPTIONS.map(function(option){return '<option value="'+option.value+'" '+(option.value===draft.type?'selected':'')+'>'+option.label+'</option>';}).join('')+'</select></label><label class="survey-create-required"><input data-edit="required" type="checkbox" '+(draft.required?'checked':'')+'><span>필수 문항</span></label></div><div data-options-editor>'+optionEditorHtml_(draft)+'</div><p class="survey-create-editor-error" data-editor-error role="alert"></p><div class="survey-create-editor-actions"><button class="v2-button v2-button--quiet" data-action="cancel" type="button">취소</button><button class="v2-button v2-button--primary" data-action="save" type="button">저장</button></div></div>';}
  function draftCounts_(){return TYPE_OPTIONS.map(function(type){return {label:type.label,count:state.questions.filter(function(question){return question.type===type.value;}).length};}).filter(function(item){return item.count>0;});}
  function renderSummary_(){const survey=state.draftSurvey||{},department=survey.department||"",contact=survey.contact||"",departmentRow=el("surveyCreateSummaryDepartment"),phoneRow=el("surveyCreateSummaryPhone");el("surveyCreateQuestionCount").textContent="총 "+state.questions.length+"개 문항";el("surveyCreateSummaryTitle").textContent=survey.title||state.formData.title||"설문 초안";el("surveyCreateSummaryAudience").textContent="대상: "+(survey.targetAudience||state.formData.targetAudience||"-");el("surveyCreateSummaryDescription").textContent=survey.description||"";departmentRow.hidden=!department;departmentRow.querySelector("dd").textContent=department;phoneRow.hidden=!contact;phoneRow.querySelector("dd").textContent=contact;el("surveyCreateSummaryContact").hidden=!department&&!contact;el("surveyCreateTypeSummary").textContent=draftCounts_().map(function(item){return item.label+" "+item.count;}).join(" · ");const seconds=state.questions.reduce(function(total,question){return total+(question.type==="TEXT"?45:question.type==="MULTIPLE"?25:15);},0);el("surveyCreateTimeSummary").textContent="예상 응답시간 약 "+Math.max(1,Math.ceil(seconds/60))+"분 (단순 추정)";}
  function renderQuestions_(){renderSummary_();el("surveyCreateQuestionList").innerHTML=state.questions.map(questionHtml_).join("")+(state.adding?'<article class="v2-card survey-create-question survey-create-question--editing survey-create-new-question">'+editorHtml_(state.editDraft,true)+'</article>':"");}
  function findQuestion_(id){return state.questions.find(function(question){return question.id===id;});}
  function moveQuestion_(id,direction){const index=state.questions.findIndex(function(question){return question.id===id;}),next=index+direction;if(index<0||next<0||next>=state.questions.length)return;const moved=state.questions.splice(index,1)[0];state.questions.splice(next,0,moved);renderQuestions_();}
  function cloneQuestion_(question){return {id:question.id,type:question.type,required:question.required,title:question.title,options:(question.options||[]).slice()};}
  function readEditor_(editor){const type=editor.querySelector('[data-edit="type"]').value,title=editor.querySelector('[data-edit="title"]').value.trim(),optionInputs=[].slice.call(editor.querySelectorAll('input[data-option-index]'));return {type:type,title:title,required:editor.querySelector('[data-edit="required"]').checked,options:type==="SCALE"?SCALE_OPTIONS.slice():hasEditableOptions(type)?optionInputs.map(function(input){return input.value.trim();}).filter(Boolean):[]};}
  function editorIsValid_(draft,editor){let message="";if(!draft.title)message="질문을 입력해 주세요.";else if(hasEditableOptions(draft.type)&&draft.options.length<2)message="선택지를 두 개 이상 입력해 주세요.";editor.querySelector("[data-editor-error]").textContent=message;return !message;}
  function cancelEdit_(){state.editingId="";state.adding=false;state.editDraft=null;renderQuestions_();}
  function handleQuestionAction_(event){const button=event.target.closest("[data-action]");if(!button)return;const card=button.closest("[data-question-id]"),editor=button.closest(".survey-create-editor"),id=card&&card.dataset.questionId,action=button.dataset.action,question=findQuestion_(id);if(action==="up"||action==="down"){moveQuestion_(id,action==="up"?-1:1);return;}if(action==="delete"){state.questions=state.questions.filter(function(item){return item.id!==id;});cancelEdit_();return;}if(action==="edit"&&question){state.adding=false;state.editingId=id;state.editDraft=cloneQuestion_(question);renderQuestions_();return;}if(action==="cancel"){cancelEdit_();return;}if(action==="add-option"||action==="remove-option"){state.editDraft=readEditor_(editor);if(action==="add-option")state.editDraft.options.push("");else state.editDraft.options.splice(Number(button.dataset.optionIndex),1);renderQuestions_();return;}if(action==="save"){const draft=readEditor_(editor);if(!editorIsValid_(draft,editor))return;if(state.adding){draft.id="q"+Date.now();state.questions.push(draft);}else if(question){Object.assign(question,draft);}cancelEdit_();}}
  function handleEditorChange_(event){if(!event.target.matches('[data-edit="type"]'))return;const editor=event.target.closest(".survey-create-editor");state.editDraft=readEditor_(editor);state.editDraft.type=event.target.value;if(state.editDraft.type==="SCALE")state.editDraft.options=SCALE_OPTIONS.slice();else if(hasEditableOptions(state.editDraft.type)&&!state.editDraft.options.length)state.editDraft.options=["선택지 1","선택지 2"];renderQuestions_();}
  function addQuestion_(){state.editingId="";state.adding=true;state.editDraft={id:"",type:"SINGLE",required:false,title:"",options:["선택지 1","선택지 2"]};renderQuestions_();const card=el("surveyCreateQuestionList").lastElementChild;if(card)card.scrollIntoView({behavior:"smooth",block:"center"});}
  function startFormMock_(){if(!state.questions.length){showStatus("Google Form에 포함할 문항을 한 개 이상 추가해 주세요.","error");return;}state.view="FORM_CREATING";render();window.setTimeout(function(){state.view="COMPLETED";showStatus("Google Form 생성 기능은 다음 개발 단계에서 연결됩니다.","");render();},550);}
  function openApplication_(){state.authenticated=true;el("surveyCreateAccessGate").hidden=true;el("surveyCreateApplication").hidden=false;render();}
  function bindEvents_(){el("surveyCreateAccessForm").addEventListener("submit",function(event){event.preventDefault();const passcode=el("surveyCreatePasscode").value.trim();if(!passcode){el("surveyCreateAccessError").textContent="인증 코드를 입력해 주세요.";return;}api.login(passcode).then(function(result){if(!result.authenticated)throw new Error("인증 코드를 확인해 주세요.");sessionStorage.setItem(TOKEN_KEY,result.token);openApplication_();}).catch(function(error){el("surveyCreateAccessError").textContent=error.message;});});el("surveyCreateLogoutButton").addEventListener("click",function(){api.logout().catch(function(){return null;}).then(function(){sessionStorage.removeItem(TOKEN_KEY);window.location.reload();});});el("surveyCreateForm").addEventListener("submit",generateDraft_);el("surveyCreateQuestionList").addEventListener("click",handleQuestionAction_);el("surveyCreateQuestionList").addEventListener("change",handleEditorChange_);el("surveyCreateAddQuestionButton").addEventListener("click",addQuestion_);el("surveyCreateBackButton").addEventListener("click",function(){cancelEdit_();state.view="INPUT";render();});el("surveyCreateFormButton").addEventListener("click",startFormMock_);el("surveyCreateReturnButton").addEventListener("click",function(){state.view="DRAFT_REVIEW";render();});}
  function initialize_(){bindEvents_();render();if(!token()){el("surveyCreatePasscode").focus();return;}api.validate().then(function(result){if(result.authenticated)openApplication_();else sessionStorage.removeItem(TOKEN_KEY);}).catch(function(){sessionStorage.removeItem(TOKEN_KEY);});}
  window.SurveyCreateApp={getState:function(){return {view:state.view,questionCount:state.questions.length};}};
  initialize_();
})(window,document);
</script>
