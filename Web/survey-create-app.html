<script>
(function(window,document){
  "use strict";
  const TOKEN_KEY="librarySurveyAccessToken";
  const TYPE_OPTIONS=[
    {value:"SINGLE",label:"단일선택"},{value:"MULTIPLE",label:"복수선택"},
    {value:"SCALE",label:"5점 만족도"},{value:"TEXT",label:"주관식"},
    {value:"RESPONDENT",label:"응답자 정보"}
  ];
  const state={view:"INPUT",authenticated:false,questions:[],editingId:"",formData:{title:"",audience:"",request:"",reference:""}};
  function el(id){return document.getElementById(id);}
  function token(){return sessionStorage.getItem(TOKEN_KEY)||"";}
  function escapeHtml(value){return String(value===null||value===undefined?"":value).replace(/[&<>"']/g,function(character){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[character];});}
  function typeLabel(type){const option=TYPE_OPTIONS.find(function(item){return item.value===type;});return option?option.label:"단일선택";}
  function needsOptions(type){return ["SINGLE","MULTIPLE","SCALE","RESPONDENT"].indexOf(type)>=0;}
  function setLoading(active,message){el("surveyCreateLoading").hidden=!active;el("surveyCreateLoadingText").textContent=message||"처리 중입니다.";}
  function showStatus(message,type){const box=el("surveyCreateGlobalStatus");box.hidden=!message;box.textContent=message||"";box.className="v2-global-status"+(type?" v2-global-status--"+type:"");}
  function setButtonBusy_(button,busy,busyLabel,idleLabel){button.disabled=Boolean(busy);button.setAttribute("aria-busy",String(Boolean(busy)));button.textContent=busy?busyLabel:idleLabel;}
  function authInvoke_(executor,loadingText){setLoading(true,loadingText);return new Promise(function(resolve,reject){const runner=google.script.run.withSuccessHandler(function(result){setLoading(false);if(!result||result.success!==true){reject(new Error(result&&result.error||"요청을 완료하지 못했습니다."));return;}resolve(result);}).withFailureHandler(function(error){setLoading(false);reject(new Error(error&&error.message||String(error)));});executor(runner);});}
  const authApi={validate:function(){return authInvoke_(function(runner){runner.validateWebAppTokenFromWeb(token());},"세션을 확인하고 있습니다.");},login:function(passcode){return authInvoke_(function(runner){runner.verifyWebAppPasscodeFromWeb(passcode);},"담당자 인증 중입니다.");},logout:function(){return authInvoke_(function(runner){runner.logoutWebAppFromWeb(token());},"로그아웃하고 있습니다.");}};

  function mockQuestions_(){const scale=["매우 만족","만족","보통","불만족","매우 불만족"];return [
    {id:"q1",type:"SINGLE",required:true,title:"프로그램을 어떤 경로로 알게 되셨습니까?",options:["도서관 홈페이지·SNS 등 인터넷","현수막·안내문 등 홍보물","가족·친구 등 지인 추천","지역 커뮤니티","기타"]},
    {id:"q2",type:"SINGLE",required:true,title:"프로그램에 참여한 주된 목적은 무엇입니까?",options:["새로운 지식 습득","취미·여가 활동","자기계발","가족과 함께 참여","기타"]},
    {id:"q3",type:"SINGLE",required:true,title:"중원도서관 프로그램을 선택한 주된 이유는 무엇입니까?",options:["프로그램 내용","강사 전문성","참여하기 편한 시간","도서관 접근성","기타"]},
    {id:"q4",type:"SCALE",required:true,title:"강사의 전문성에 만족하셨습니까?",options:scale.slice()},
    {id:"q5",type:"SCALE",required:true,title:"강의 전달력에 만족하셨습니까?",options:scale.slice()},
    {id:"q6",type:"SCALE",required:true,title:"운영시간 및 기간에 만족하셨습니까?",options:scale.slice()},
    {id:"q7",type:"SCALE",required:true,title:"시설 및 환경에 만족하셨습니까?",options:scale.slice()},
    {id:"q8",type:"MULTIPLE",required:false,title:"관심 있거나 배우고 싶은 분야를 선택해주세요.",options:["독서·인문","문화·예술","디지털·미디어","외국어","건강·생활"]},
    {id:"q9",type:"TEXT",required:false,title:"개설을 희망하는 강좌 또는 개선사항이 있다면 작성해주세요.",options:[]},
    {id:"q10",type:"RESPONDENT",required:true,title:"연령대를 선택해주세요.",options:["10대 이하","20대","30대","40대","50대","60대 이상"]}
  ];}
  const mockSurveyGenerator={generate:function(input){return new Promise(function(resolve){window.setTimeout(function(){resolve({survey:{title:input.title,targetAudience:input.audience},questions:mockQuestions_()});},650);});}};

  function syncSteps_(){const order={INPUT:0,GENERATING:0,DRAFT_REVIEW:1,FORM_CREATING:2,COMPLETED:2},active=order[state.view]||0;["Input","Review","Form"].forEach(function(name,index){const item=el("surveyCreateStep"+name),status=item.querySelector(".v2-step__status");item.className="v2-step"+(index===active?" v2-step--current":index<active?" v2-step--complete":"");status.textContent=index===active?(state.view==="GENERATING"||state.view==="FORM_CREATING"?"처리 중":"현재"):index<active?"✓ 완료":"대기";});}
  function render(){el("surveyCreateInputView").hidden=state.view!=="INPUT";el("surveyCreateProcessingView").hidden=state.view!=="GENERATING"&&state.view!=="FORM_CREATING";el("surveyCreateReviewView").hidden=state.view!=="DRAFT_REVIEW";el("surveyCreateCompletedView").hidden=state.view!=="COMPLETED";syncSteps_();if(state.view==="DRAFT_REVIEW")renderQuestions_();if(state.view==="GENERATING"){el("surveyCreateProcessingTitle").textContent="설문 문항을 구성하고 있습니다.";el("surveyCreateProcessingDescription").textContent="조사 목적과 대상에 맞는 질문을 준비하고 있습니다.";}if(state.view==="FORM_CREATING"){el("surveyCreateProcessingTitle").textContent="Google Form 생성 준비를 확인하고 있습니다.";el("surveyCreateProcessingDescription").textContent="검토한 문항을 Form으로 전달할 준비를 하고 있습니다.";}}
  function readForm_(){return {title:el("surveyCreateTitleInput").value.trim(),audience:el("surveyCreateAudienceInput").value.trim(),request:el("surveyCreateRequestInput").value.trim(),reference:el("surveyCreateReferenceInput").value.trim()};}
  function validateInput_(input){const fields=[{key:"title",id:"surveyCreateTitleError",message:"조사명을 입력해 주세요."},{key:"audience",id:"surveyCreateAudienceError",message:"조사 대상을 입력해 주세요."},{key:"request",id:"surveyCreateRequestError",message:"설문 요청내용을 입력해 주세요."}],missing=[];fields.forEach(function(field){const invalid=!input[field.key];el(field.id).textContent=invalid?field.message:"";if(invalid)missing.push(field);});if(missing.length){showStatus("필수 입력값을 확인해 주세요.","error");el(missing[0].id.replace("Error","Input")).focus();return false;}showStatus("","");return true;}
  function generateDraft_(event){event.preventDefault();const input=readForm_();if(!validateInput_(input))return;state.formData=input;state.view="GENERATING";render();mockSurveyGenerator.generate(input).then(function(result){state.questions=result.questions;state.view="DRAFT_REVIEW";showStatus("설문 초안이 생성되었습니다.","success");render();el("surveyCreateMain").focus();}).catch(function(error){state.view="INPUT";showStatus(error.message,"error");render();});}
  function questionHtml_(question,index){const options=question.options||[],editing=state.editingId===question.id;return '<article class="v2-card survey-create-question" data-question-id="'+escapeHtml(question.id)+'"><div class="survey-create-question__top"><div><span class="survey-create-question__number">Q'+(index+1)+'</span><h3>'+escapeHtml(question.title)+'</h3></div><div class="survey-create-question__badges"><span class="v2-badge v2-badge--ai">'+escapeHtml(typeLabel(question.type))+'</span><span class="v2-badge '+(question.required?'v2-badge--success':'v2-badge--neutral')+'">'+(question.required?'필수':'선택')+'</span></div></div>'+(options.length?'<ul class="survey-create-question__options">'+options.map(function(option){return '<li>'+escapeHtml(option)+'</li>';}).join('')+'</ul>':'')+'<div class="survey-create-question__actions"><button class="v2-button v2-button--quiet" data-action="up" type="button" '+(index===0?'disabled':'')+'>위로</button><button class="v2-button v2-button--quiet" data-action="down" type="button" '+(index===state.questions.length-1?'disabled':'')+'>아래로</button><button class="v2-button v2-button--quiet" data-action="edit" type="button">'+(editing?'수정 닫기':'수정')+'</button><button class="v2-button v2-button--quiet" data-action="delete" type="button">삭제</button></div>'+(editing?editorHtml_(question):'')+'</article>';}
  function editorHtml_(question){return '<div class="survey-create-editor"><label><span>질문</span><input data-edit="title" value="'+escapeHtml(question.title)+'"></label><div class="survey-create-editor-row"><label><span>문항 유형</span><select data-edit="type">'+TYPE_OPTIONS.map(function(option){return '<option value="'+option.value+'" '+(option.value===question.type?'selected':'')+'>'+option.label+'</option>';}).join('')+'</select></label><label><span>필수 여부</span><select data-edit="required"><option value="true" '+(question.required?'selected':'')+'>필수</option><option value="false" '+(!question.required?'selected':'')+'>선택</option></select></label><button class="v2-button v2-button--secondary" data-action="save" type="button">수정 저장</button></div><label data-options-field '+(needsOptions(question.type)?'':'hidden')+'><span>선택지 (한 줄에 하나)</span><textarea data-edit="options">'+escapeHtml((question.options||[]).join('\n'))+'</textarea></label></div>';}
  function renderQuestions_(){el("surveyCreateQuestionCount").textContent="총 "+state.questions.length+"개 문항";el("surveyCreateQuestionList").innerHTML=state.questions.map(questionHtml_).join("");}
  function findQuestion_(id){return state.questions.find(function(question){return question.id===id;});}
  function moveQuestion_(id,direction){const index=state.questions.findIndex(function(question){return question.id===id;}),next=index+direction;if(index<0||next<0||next>=state.questions.length)return;const moved=state.questions.splice(index,1)[0];state.questions.splice(next,0,moved);renderQuestions_();}
  function handleQuestionAction_(event){const button=event.target.closest("[data-action]");if(!button)return;const card=button.closest("[data-question-id]"),id=card&&card.dataset.questionId,action=button.dataset.action,question=findQuestion_(id);if(action==="up"||action==="down"){moveQuestion_(id,action==="up"?-1:1);return;}if(action==="delete"){state.questions=state.questions.filter(function(item){return item.id!==id;});renderQuestions_();return;}if(action==="edit"){state.editingId=state.editingId===id?"":id;renderQuestions_();return;}if(action==="save"&&question){const type=card.querySelector('[data-edit="type"]').value;question.title=card.querySelector('[data-edit="title"]').value.trim()||question.title;question.type=type;question.required=card.querySelector('[data-edit="required"]').value==="true";question.options=needsOptions(type)?card.querySelector('[data-edit="options"]').value.split(/\n/).map(function(value){return value.trim();}).filter(Boolean):[];state.editingId="";renderQuestions_();}}
  function addQuestion_(){const id="q"+Date.now();state.questions.push({id:id,type:"SINGLE",required:false,title:"새 질문을 입력해 주세요.",options:["선택지 1","선택지 2"]});state.editingId=id;renderQuestions_();const card=el("surveyCreateQuestionList").lastElementChild;if(card)card.scrollIntoView({behavior:"smooth",block:"center"});}
  function startFormMock_(){if(!state.questions.length){showStatus("Google Form에 포함할 문항을 한 개 이상 추가해 주세요.","error");return;}state.view="FORM_CREATING";render();window.setTimeout(function(){state.view="COMPLETED";showStatus("Google Form 생성 기능은 다음 개발 단계에서 연결됩니다.","");render();},550);}
  function openApplication_(){state.authenticated=true;el("surveyCreateAccessGate").hidden=true;el("surveyCreateApplication").hidden=false;render();}
  function bindEvents_(){el("surveyCreateAccessForm").addEventListener("submit",function(event){event.preventDefault();const passcode=el("surveyCreatePasscode").value.trim();if(!passcode){el("surveyCreateAccessError").textContent="인증 코드를 입력해 주세요.";return;}authApi.login(passcode).then(function(result){if(!result.authenticated)throw new Error("인증 코드를 확인해 주세요.");sessionStorage.setItem(TOKEN_KEY,result.token);openApplication_();}).catch(function(error){el("surveyCreateAccessError").textContent=error.message;});});el("surveyCreateLogoutButton").addEventListener("click",function(){authApi.logout().catch(function(){return null;}).then(function(){sessionStorage.removeItem(TOKEN_KEY);window.location.reload();});});el("surveyCreateForm").addEventListener("submit",generateDraft_);el("surveyCreateQuestionList").addEventListener("click",handleQuestionAction_);el("surveyCreateAddQuestionButton").addEventListener("click",addQuestion_);el("surveyCreateBackButton").addEventListener("click",function(){state.view="INPUT";render();});el("surveyCreateFormButton").addEventListener("click",startFormMock_);el("surveyCreateReturnButton").addEventListener("click",function(){state.view="DRAFT_REVIEW";render();});}
  function initialize_(){bindEvents_();render();if(!token()){el("surveyCreatePasscode").focus();return;}authApi.validate().then(function(result){if(result.authenticated)openApplication_();else sessionStorage.removeItem(TOKEN_KEY);}).catch(function(){sessionStorage.removeItem(TOKEN_KEY);});}
  window.SurveyCreateApp={getState:function(){return {view:state.view,questionCount:state.questions.length};},mockSurveyGenerator:mockSurveyGenerator};
  initialize_();
})(window,document);
</script>
